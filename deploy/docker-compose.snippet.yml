# Merge this snippet into a host compose stack. Configure the external networks
# and Splunk endpoint for that stack; all values below are examples.
# With these bridge networks use tv.wake.kind = "http". Direct WoL requires
# network_mode: host instead (remove networks below; reverse proxy by host port).
x-splunk: &splunk
  driver: splunk
  options:
    splunk-url: "https://logs.example.com:8088"
    splunk-token: "${SPLUNK_TOKEN:?set SPLUNK_TOKEN}"
    tag: "{{.Name}}"

services:
  choregos:
    image: ghcr.io/yasen-pavlov/choregos:latest
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Mount the directory, not a single file: saves use atomic rename.
    # It must be writable by uid 65532 for UI config edits and mode persistence.
    volumes:
      - ./choregos:/config
    environment:
      VIRTUAL_HOST: choregos.example.com
      VIRTUAL_PORT: "8095"
      CHOREGOS_MQTT_PASSWORD: "${CHOREGOS_MQTT_PASSWORD:?required}"
      CHOREGOS_HA_TOKEN: "${CHOREGOS_HA_TOKEN:?required}"
      CHOREGOS_SESSION_SECRET: "${CHOREGOS_SESSION_SECRET:?required}"
      CHOREGOS_OIDC_CLIENT_SECRET: "${CHOREGOS_OIDC_CLIENT_SECRET:?required}"
      CHOREGOS_LOCAL_PASSWORD: "${CHOREGOS_LOCAL_PASSWORD:?required}"
    networks: [main, system_main]
    logging: *splunk
    healthcheck:
      test: [CMD, /usr/local/bin/choregos, healthz, --url, "http://127.0.0.1:8095/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  main:
    external: true
  system_main:
    external: true
