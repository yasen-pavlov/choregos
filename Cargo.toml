[package]
name = "choregos"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "choregos"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
argon2 = "=0.6.0"
askama = "=0.16.1"
axum = { version = "=0.8.9", features = ["macros"] }
chrono = { version = "=0.4.45", features = ["serde"] }
chrono-tz = "=0.10.4"
clap = { version = "=4.6.7", features = ["derive"] }
futures-util = { version = "=0.3.34", features = ["sink"] }
hex = "=0.4.3"
openidconnect = { version = "=4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
rand = "=0.10.3"
rumqttc = { version = "=0.25.1", default-features = false }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["full"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "=1.1.8"
tower-http = { version = "=0.7.1", features = ["fs", "trace"] }
tower-sessions = { version = "=0.15.0", features = ["memory-store", "signed"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }
uuid = { version = "=1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
rumqttd = { version = "=0.20.0", default-features = false }
tempfile = "=3.27.0"
tokio-test = "=0.4.6"
tokio = { version = "=1.54.1", features = ["test-util"] }
tower = { version = "=0.5.3", features = ["util"] }
